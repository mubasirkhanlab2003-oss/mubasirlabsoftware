[build]
  command = "npm run build"
  publish = "dist"

# The app has its own pages (/cases/…, /p/… report links). Netlify serves real
# files first; anything else opens the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
